openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: parking
    description: Camera configuration and parking-lot analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /parking/cameras:
    get:
      operationId: listParkingCameras
      tags: [parking]
      summary: List saved camera configurations
      responses:
        "200":
          description: Saved camera configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParkingCamera"
    post:
      operationId: saveParkingCamera
      tags: [parking]
      summary: Save a camera-specific parking layout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkingCameraInput"
      responses:
        "200":
          description: Saved camera configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkingCamera"
  /parking/cameras/{cameraId}:
    delete:
      operationId: deleteParkingCamera
      tags: [parking]
      summary: Delete a camera configuration
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Camera configuration deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteCameraResult"
  /parking/analyze:
    post:
      operationId: analyzeParkingImage
      tags: [parking]
      summary: Detect vehicles and calculate parking occupancy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParkingAnalysisInput"
      responses:
        "200":
          description: Annotated parking image and occupancy results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkingAnalysisResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ParkingPoint:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
      required: [x, y]
    ParkingSpaceInput:
      type: object
      properties:
        id:
          type: string
        polygon:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/ParkingPoint"
      required: [id, polygon]
    ParkingCamera:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        referenceWidth:
          type: integer
        referenceHeight:
          type: integer
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/ParkingSpaceInput"
      required: [id, name, referenceWidth, referenceHeight, spaces]
    ParkingCameraInput:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        referenceWidth:
          type: integer
        referenceHeight:
          type: integer
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/ParkingSpaceInput"
      required: [id, name, referenceWidth, referenceHeight, spaces]
    DeleteCameraResult:
      type: object
      properties:
        deleted:
          type: boolean
      required: [deleted]
    ParkingAnalysisInput:
      type: object
      properties:
        cameraId:
          type: string
        imageBase64:
          type: string
          description: Base64-encoded JPEG or PNG image data, with or without a data URL prefix
        confidence:
          type: number
          minimum: 0.05
          maximum: 0.95
      required: [cameraId, imageBase64, confidence]
    VehicleDetection:
      type: object
      properties:
        label:
          type: string
        confidence:
          type: number
        box:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: integer
        occupiedSpaceIds:
          type: array
          items:
            type: string
      required: [label, confidence, box, occupiedSpaceIds]
    ParkingSpaceStatus:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [AVAILABLE, OCCUPIED]
      required: [id, status]
    ParkingAnalysisResult:
      type: object
      properties:
        imageBase64:
          type: string
        width:
          type: integer
        height:
          type: integer
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/VehicleDetection"
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/ParkingSpaceStatus"
        totalSpaces:
          type: integer
        availableSpaces:
          type: integer
        occupiedSpaces:
          type: integer
        occupancyPercent:
          type: number
        occupancyLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH]
      required:
        - imageBase64
        - width
        - height
        - vehicles
        - spaces
        - totalSpaces
        - availableSpaces
        - occupiedSpaces
        - occupancyPercent
        - occupancyLevel

